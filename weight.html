<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracking | FitTrack</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav>
        <div class="logo">
            <h2 class="text-gradient">FitTrack</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="weight.html" class="nav-link active">Weight</a>
            <a href="#" class="nav-link">Meals</a>
            <a href="#" class="nav-link">Settings</a>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-gradient);"></div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <h1>Weight <span style="font-weight: 400; color: var(--text-muted); font-size: 1.5rem; margin-left: 0.5rem;">Tracking</span></h1>
            <button class="btn btn-primary" id="openLogBtn">
                <i data-lucide="plus" style="width: 18px;"></i> Log Weight
            </button>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
            <!-- Entry Form -->
            <div class="glass-card animate-fade-in" style="padding: 2rem; height: fit-content;">
                <h3 style="margin-bottom: 1.5rem;">Quick Log</h3>
                <form id="weightForm">
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" id="weightInput" placeholder="0.0" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="dateInput" required>
                    </div>
                    <div class="form-group">
                        <label>Note (Optional)</label>
                        <input type="text" id="noteInput" placeholder="Morning weigh-in">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                        Save Entry
                    </button>
                </form>
            </div>

            <!-- History Table -->
            <div class="glass-card animate-fade-in" style="padding: 2rem; animation-delay: 0.1s;">
                <h3 style="margin-bottom: 1.5rem;">History</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--card-border);">
                                <th style="padding: 1rem; color: var(--text-muted); font-size: 0.875rem;">Date</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-size: 0.875rem;">Weight</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-size: 0.875rem;">Change</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-size: 0.875rem;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="weightHistoryBody">
                            <!-- Data injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        // Set default date to today
        document.getElementById('dateInput').valueAsDate = new Date();

        const tbody = document.getElementById('weightHistoryBody');
        
        function renderHistory() {
            const data = FitTrack.getData();
            const history = data.logs;
            
            tbody.innerHTML = '';
            history.forEach((item, index) => {
                const nextWeight = history[index + 1] ? history[index + 1].weight : item.weight;
                const change = (item.weight - nextWeight).toFixed(1);
                
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--card-border)';
                tr.innerHTML = `
                    <td style="padding: 1rem;">${item.date}</td>
                    <td style="padding: 1rem; font-weight: 600;">${item.weight} kg</td>
                    <td style="padding: 1rem; color: ${change <= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${change > 0 ? '+' : ''}${change} kg
                    </td>
                    <td style="padding: 1rem;">
                        <button class="btn btn-outline" style="padding: 0.25rem 0.5rem;"><i data-lucide="edit-2" style="width: 14px;"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        renderHistory();

        document.getElementById('weightForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const weight = document.getElementById('weightInput').value;
            const date = document.getElementById('dateInput').value;
            const note = document.getElementById('noteInput').value;
            
            FitTrack.addLog(weight, date, note);
            renderHistory();
            e.target.reset();
            document.getElementById('dateInput').valueAsDate = new Date();
        });
    </script>
</body>
</html>
