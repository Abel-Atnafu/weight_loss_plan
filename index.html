<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Reclaim Your Health</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav>
        <div class="logo">
            <h2 class="text-gradient">FitTrack</h2>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Features</a>
            <a href="#" class="nav-link">Pricing</a>
        </div>
        <div>
            <button class="btn btn-outline" id="loginBtn">Login</button>
        </div>
    </nav>

    <main class="container">
        <section class="hero animate-fade-in" style="text-align: center; padding: 4rem 0;">
            <h1 style="font-size: 4rem; margin-bottom: 1.5rem;">Your Journey to a <span class="text-gradient">Healthy Life</span> Starts Here</h1>
            <p style="color: var(--text-muted); font-size: 1.25rem; max-width: 600px; margin: 0 auto 2.5rem;">
                The most advanced weight loss tracker designed to keep you motivated and focused on your goals.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-primary" style="padding: 1rem 2.5rem; font-size: 1.1rem;">Get Started Free</button>
                <button class="btn btn-outline" style="padding: 1rem 2.5rem; font-size: 1.1rem;">Watch Demo</button>
            </div>
        </section>

        <!-- Auth Modal (Simulated) -->
        <div id="authOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000;">
            <div class="glass-card animate-fade-in" style="width: 100%; max-width: 400px; padding: 2.5rem;">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" value="abelatnafu.g@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" value="209211">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                        Sign In
                    </button>
                </form>
                <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.875rem;">
                    Don't have an account? <a href="#" style="color: var(--primary); text-decoration: none;">Sign Up</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const loginBtn = document.getElementById('loginBtn');
        const authOverlay = document.getElementById('authOverlay');
        const loginForm = document.getElementById('loginForm');

        loginBtn.addEventListener('click', () => {
            authOverlay.style.display = 'flex';
        });

        authOverlay.addEventListener('click', (e) => {
            if (e.target === authOverlay) {
                authOverlay.style.display = 'none';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate login
            const email = document.getElementById('email').value;
            localStorage.setItem('userEmail', email);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
