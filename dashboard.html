<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FitTrack</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <div class="logo">
            <h2 class="text-gradient">FitTrack</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link active">Dashboard</a>
            <a href="weight.html" class="nav-link">Weight</a>
            <a href="#" class="nav-link">Meals</a>
            <a href="#" class="nav-link">Settings</a>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div style="text-align: right; line-height: 1.2;">
                <p id="userEmailDisplay" style="font-size: 0.875rem; font-weight: 600;">User</p>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Pro Member</p>
            </div>
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-gradient);"></div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-bottom: 2rem;">
            <h1>Dashboard <span style="font-weight: 400; color: var(--text-muted); font-size: 1.5rem; margin-left: 0.5rem;">Overview</span></h1>
        </header>

        <div class="dashboard-grid">
            <div class="glass-card stat-card animate-fade-in">
                <p class="stat-label">Current Weight</p>
                <p class="stat-value" id="currentWeight">82.5 <span style="font-size: 1rem; font-weight: 400; color: var(--text-muted);">kg</span></p>
                <p style="color: var(--success); font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem;">
                    <i data-lucide="arrow-down-right" style="width: 14px;"></i> 0.8kg this week
                </p>
            </div>
            <div class="glass-card stat-card animate-fade-in" style="animation-delay: 0.1s;">
                <p class="stat-label">Total Lost</p>
                <p class="stat-value" style="color: var(--primary);">7.5 <span style="font-size: 1rem; font-weight: 400; color: var(--text-muted);">kg</span></p>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Started at 90kg</p>
            </div>
            <div class="glass-card stat-card animate-fade-in" style="animation-delay: 0.2s;">
                <p class="stat-label">Goal Progress</p>
                <p class="stat-value">65 <span style="font-size: 1rem; font-weight: 400; color: var(--text-muted);">%</span></p>
                <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
                    <div style="width: 65%; height: 100%; background: var(--primary-gradient);"></div>
                </div>
            </div>
            <div class="glass-card stat-card animate-fade-in" style="animation-delay: 0.3s;">
                <p class="stat-label">BMI</p>
                <p class="stat-value">24.2</p>
                <p style="color: var(--success); font-size: 0.875rem;">Healthy Range</p>
            </div>
        </div>

        <div class="glass-card animate-fade-in" style="margin-top: 2rem; padding: 2rem; animation-delay: 0.4s;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h3>Weight Journey</h3>
                <div class="btn-group">
                    <button class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Week</button>
                    <button class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem; background: rgba(255,255,255,0.1);">Month</button>
                    <button class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Year</button>
                </div>
            </div>
            <canvas id="progressChart" height="100"></canvas>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
        
        const data = FitTrack.getData();
        const stats = FitTrack.getStats();

        document.getElementById('userEmailDisplay').textContent = data.user.email;
        document.getElementById('currentWeight').innerHTML = `${stats.current} <span style="font-size: 1rem; font-weight: 400; color: var(--text-muted);">${data.user.unit}</span>`;
        
        // Update other stats (simplified for now)
        // ...

        // Initialize Chart with real data
        const ctx = document.getElementById('progressChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
        gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');

        const chartData = [...data.logs].reverse();

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.map(log => log.date),
                datasets: [{
                    label: `Weight (${data.user.unit})`,
                    data: chartData.map(log => log.weight),
                    borderColor: '#6366f1',
                    borderWidth: 3,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4,
                    pointBackgroundColor: '#6366f1',
                    pointBorderColor: '#fff',
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#94a3b8' }
                    }
                }
            }
        });
    </script>
</body>
</html>
